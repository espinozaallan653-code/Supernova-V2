<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0716; color: #f3eeff; font-family: system-ui, sans-serif; }
    .wrap { text-align: center; }
    canvas { background: #120b22; border: 2px solid #3b2a63; border-radius: 12px; max-width: 92vmin; max-height: 80vmin; touch-action: none; }
    .hud { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; }
    p { color: #b3a6d4; }
</style>
</head>
<body>
<div class="wrap">
    <div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
    <canvas id="c" width="480" height="480"></canvas>
    <p id="msg">Press any arrow key / WASD or swipe to start</p>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const N = 24, S = c.width / N;
let snake, dir, nextDir, food, score, running, timer;
let best = +localStorage.getItem('snake-best') || 0;
document.getElementById('best').textContent = best;

function reset() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    dir = nextDir = { x: 1, y: 0 };
    score = 0; document.getElementById('score').textContent = 0;
    placeFood(); draw();
}
function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
}
function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score++; document.getElementById('score').textContent = score;
        placeFood();
        clearInterval(timer); timer = setInterval(step, Math.max(60, 130 - score * 3));
    } else snake.pop();
    draw();
}
function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#ff8a5c';
    ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2.4, 0, Math.PI * 2); ctx.fill();
    snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#4ade80' : `hsl(142, 70%, ${45 - Math.min(i, 20)}%)`;
        ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
    });
}
function gameOver() {
    clearInterval(timer); running = false;
    if (score > best) { best = score; localStorage.setItem('snake-best', best); document.getElementById('best').textContent = best; }
    document.getElementById('msg').textContent = `Game over! Score ${score}. Press any direction to play again.`;
    reset();
}
function turn(x, y) {
    if (!running) { running = true; document.getElementById('msg').textContent = ' '; timer = setInterval(step, 130); }
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
}
const keys = { ArrowUp: [0,-1], w: [0,-1], ArrowDown: [0,1], s: [0,1], ArrowLeft: [-1,0], a: [-1,0], ArrowRight: [1,0], d: [1,0] };
addEventListener('keydown', e => { const k = keys[e.key]; if (k) { e.preventDefault(); turn(...k); } });
let tx, ty;
c.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
c.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});
reset();
</script>
</body>
</html>
