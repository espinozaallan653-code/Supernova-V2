<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0716; color: #f3eeff; font-family: system-ui, sans-serif; touch-action: none; }
    .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; }
    button { background: #b56cff; border: 0; color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .board { --size: min(84vmin, 440px); width: var(--size); height: var(--size); display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; background: #241640; border-radius: 14px; box-sizing: border-box; }
    .tile { display: grid; place-items: center; border-radius: 8px; background: #33235a; font-weight: 800; font-size: calc(var(--size) / 10); transition: background .1s; }
    p { color: #b3a6d4; text-align: center; }
</style>
</head>
<body>
<div>
    <div class="hud"><span>Score: <b id="score">0</b> · Best: <b id="best">0</b></span><button onclick="init()">New game</button></div>
    <div class="board" id="board"></div>
    <p id="msg">Use arrow keys or swipe to merge tiles.</p>
</div>
<script>
const colors = { 2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e' };
let grid, score, best = +localStorage.getItem('2048-best') || 0;
const board = document.getElementById('board');

function init() {
    grid = Array.from({ length: 4 }, () => Array(4).fill(0));
    score = 0; add(); add(); render();
    document.getElementById('msg').textContent = 'Use arrow keys or swipe to merge tiles.';
}
function add() {
    const empty = [];
    grid.forEach((r, y) => r.forEach((v, x) => !v && empty.push([y, x])));
    if (!empty.length) return;
    const [y, x] = empty[Math.floor(Math.random() * empty.length)];
    grid[y][x] = Math.random() < 0.9 ? 2 : 4;
}
function render() {
    board.innerHTML = '';
    grid.flat().forEach(v => {
        const t = document.createElement('div'); t.className = 'tile';
        if (v) { t.textContent = v; t.style.background = colors[v] || '#3c3a32'; t.style.color = v <= 4 ? '#776e65' : '#fff'; if (v >= 1024) t.style.fontSize = 'calc(var(--size) / 14)'; }
        board.appendChild(t);
    });
    if (score > best) { best = score; localStorage.setItem('2048-best', best); }
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
}
function slideRow(row) {
    const a = row.filter(Boolean);
    for (let i = 0; i < a.length - 1; i++) if (a[i] === a[i + 1]) { a[i] *= 2; score += a[i]; a.splice(i + 1, 1); }
    while (a.length < 4) a.push(0);
    return a;
}
const rotate = g => g[0].map((_, i) => g.map(r => r[i]).reverse());
function move(dirTurns) {
    let g = grid;
    for (let i = 0; i < dirTurns; i++) g = rotate(g);
    g = g.map(slideRow);
    for (let i = 0; i < (4 - dirTurns) % 4; i++) g = rotate(g);
    if (JSON.stringify(g) === JSON.stringify(grid)) return;
    grid = g; add(); render();
    if (grid.flat().includes(2048)) document.getElementById('msg').textContent = 'You made 2048! 🎉 Keep going!';
    if (!canMove()) document.getElementById('msg').textContent = 'No moves left — press New game.';
}
function canMove() {
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
        if (!grid[y][x]) return true;
        if (x < 3 && grid[y][x] === grid[y][x + 1]) return true;
        if (y < 3 && grid[y][x] === grid[y + 1][x]) return true;
    }
    return false;
}
// turns: rotate clockwise N times so the move becomes a left slide
const keys = { ArrowLeft: 0, a: 0, ArrowDown: 1, s: 1, ArrowRight: 2, d: 2, ArrowUp: 3, w: 3 };
addEventListener('keydown', e => { if (e.key in keys) { e.preventDefault(); move(keys[e.key]); } });
let tx, ty;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0); else move(dy > 0 ? 1 : 3);
});
init();
</script>
</body>
</html>
